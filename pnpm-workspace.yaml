storeDir: .pnpm-store
preferFrozenLockfile: true
enableGlobalVirtualStore: false

# Vite/PostCSS transitive security fixes. Keep these constraints until the
# direct toolchain dependencies require versions at least this new.
overrides:
  nanoid: 3.3.18
  postcss: 8.5.23
  source-map-js: 1.2.2

minimumReleaseAgeExclude:
  - '@tauri-apps/plugin-dialog@2.7.2'
